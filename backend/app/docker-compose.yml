name: plugin-docker-compose

services:
  plugin-keycloak:
    container_name: plugin-docker-compose-plugin-keycloak
    depends_on:
      - plugin-keycloak-database
    image: quay.io/keycloak/keycloak:26.2.2
    ports:
      - "8081:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://plugin-keycloak-database/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_FEATURES: token-exchange,admin-fine-grained-authz
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
    volumes:
      - ./imports/keycloak:/opt/keycloak/data/import
    command:
      - start-dev
      - --import-realm
      - --http-enabled=true
      - --hostname-strict=false
    healthcheck:
      test: [ 'CMD-SHELL', '[ -f /tmp/HealthCheck.java ] || echo "public class HealthCheck { public static void main(String[] args) throws java.lang.Throwable { System.exit(((java.net.HttpURLConnection)new java.net.URL(args[0]).openConnection()).getResponseCode() == 200 ? 0 : 1); } }" > /tmp/HealthCheck.java && java /tmp/HealthCheck.java http://localhost:8080/auth' ]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 5s

  plugin-keycloak-database:
    image: postgres:17.4
    container_name: plugin-docker-compose-plugin-keycloak-database
    ports:
      - "54329:5432"
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak

  plugin-database:
    container_name: plugin-docker-compose-plugin-database
    image: postgres:17.4
    ports:
      - "54320:5432"
    environment:
      POSTGRES_USER: plugin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: plugin
    volumes:
      - plugin-database-data:/var/lib/postgres # persist data even if container shuts down

  plugin-rabbitmq:
    image: rabbitmq:4.1.0-management
    container_name: plugin-docker-compose-plugin-rabbitmq
    volumes:
      - ./imports/plugin-rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./imports/plugin-rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./imports/plugin-rabbitmq/advanced.config:/etc/rabbitmq/advanced.config:ro
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_CONFIG_FILE: /etc/rabbitmq/rabbitmq.conf
    command: >
      bash -c "
        rabbitmq-plugins enable --offline rabbitmq_stream rabbitmq_stream_management rabbitmq_shovel rabbitmq_shovel_management &&
        rabbitmq-server
      "
    extra_hosts:
      - "host.docker.internal:host-gateway"

  plugin-host:
    image: ritense/valtimo-plugin-host:1.0.0
    container_name: plugin-docker-compose-plugin-host
    depends_on:
      - plugin-host-database
    ports:
      - "8092:8090"
    environment:
      DB_HOST: plugin-host-database
      DB_PORT: 5432
      DB_NAME: pluginhost
      DB_USER: pluginhost
      DB_PASSWORD: pluginhost
      ADMIN_TOKEN: admin-secret-token
      BASE_URL: http://plugin-host:8090
      GZAC_CALLBACK_URL: http://host.docker.internal:8080
      ALLOWED_ORIGINS: http://localhost:4200,http://localhost:8080
      PLUGIN_PREINSTALL_DIR: /plugins
      PLUGIN_PREINSTALL_OVERWRITE: "true"
      HOST_ALLOW_HTTP: "true"
      HOST_ALLOW_PRIVATE_NETWORK: "true"
    tmpfs:
      - /app/.tmp:uid=1000,gid=1000
    volumes:
      - ./imports/plugins:/plugins:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  plugin-host-database:
    image: postgres:17.4
    container_name: plugin-docker-compose-plugin-host-database
    ports:
      - "54321:5432"
    environment:
      POSTGRES_USER: pluginhost
      POSTGRES_PASSWORD: pluginhost
      POSTGRES_DB: pluginhost
    volumes:
      - plugin-host-database-data:/var/lib/postgresql/data

volumes:
  plugin-database-data:
  plugin-host-database-data:
